[alembic]
script_location = services/api/alembic
prepend_sys_path = services/api
# The URL comes from NOVA_DATABASE_URL so the app and migrations cannot target
# different databases. This fallback only applies to a bare local run.
sqlalchemy.url = sqlite:///./nova.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
