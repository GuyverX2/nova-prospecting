[project]
name = "nova-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "PyJWT>=2.8,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools]
package-dir = {"" = "services/api"}

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["tests/test_standalone_backend.py", "tests/test_coupling_audit.py", "tests/test_gate_c_preparation.py"]
