[project]
name = "nova-backend"
version = "0.1.0"
requires-python = ">=3.11"
description = "Evidence-first website prospecting: audit, propose, approve, deliver."
readme = "README.md"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.7,<3",
  "PyJWT>=2.8,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]
# PostgreSQL is the supported multi-worker database; SQLite needs no driver.
postgres = ["psycopg[binary]>=3.1,<4"]
dev = [
  "nova-backend[test]",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = {"" = "services/api"}

[tool.setuptools.packages.find]
where = ["services/api"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["services/api", "tests"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["apps", "services/api/alembic/versions"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "B",    # bugbears
  "UP",   # pyupgrade
  "S",    # security (bandit)
  "C4",   # comprehensions
  "SIM",  # simplifications
  "RUF",  # ruff-specific
]
ignore = [
  "E501",    # long lines are reported by the formatter, not the linter
  "B008",    # FastAPI dependencies are declared as call defaults by design
  "SIM108",  # a ternary is not always clearer than an if/else
  # Customer-facing copy is Swedish and typographic: en dashes, angle quotes and
  # the multiplication sign are intended characters, not homoglyph mistakes.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
# `app` is the backend package (services/api is on the path), not a third party.
known-first-party = ["app", "crawl_spike"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour; asserts and hard-coded sample credentials are the point.
"tests/*" = ["S101", "S105", "S106", "S311"]
"scripts/*" = ["S101", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
mypy_path = "services/api"
packages = ["app"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false
# Every ignore must name the rule it silences, so none of them are blanket.
enable_error_code = ["ignore-without-code", "redundant-expr"]
